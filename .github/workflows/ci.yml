name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # A build-time-only placeholder. No route in this app queries the
          # database at build time (all Prisma access happens in dynamic
          # route handlers), so this never needs to be a reachable database -
          # it only has to be present so `src/lib/db.ts` doesn't throw at
          # module-evaluation time during the build.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rankly
          POSTGRES_PASSWORD: rankly_ci_only
          POSTGRES_DB: rankly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://rankly:rankly_ci_only@localhost:5432/rankly_ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm run test:integration
